[project]
name = "moflow-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx==0.28.1",
  "pydantic>=2.10,<3", "playwright>=1.50,<2", "patchright==1.64.1", "pillow>=11,<13",
  "python-multipart>=0.0.20,<1", "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "apscheduler>=3.11,<4",
  "mcp>=1.20,<2", "psutil>=6,<8", "pyinstaller>=6,<7", "curl-cffi==0.16.3",
  "pytest>=8,<10", "pytest-asyncio>=1,<2", "respx>=0.22,<1",
  "f2 @ git+https://github.com/Johnserf-Seed/f2.git@f6be8c0ffba9a127075bbeafe4838716650b6325"
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
