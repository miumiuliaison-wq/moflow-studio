[package]
name = "moflow"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
rfd = "0.15"
serde_json = "1"
url = "2"
uuid = {version="1",features= ["v4"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com"] }
